    url: "https://github.com/zapplyjobs/New-Grad-Data-Science-Jobs-2027"
    fetch_prompt: "From the Data Scientist and Data Analyst tables, list every US posting with Posted age of 3 days or less\
      \ (e.g. '16h', '1d', '2d', '3d') whose role is entry level, new grad, early career, associate, analyst I/1, or a 2027\
      \ program. Skip manager, lead, senior, principal, director, team lead, SME, co-op/intern (unless paid, remote and part-time).\
      \ Output JSON lines: {company, title, location, posted_age, url}."
    search: zapplyjobs New-Grad-Data-Science-Jobs-2027 github
search_note: Each run takes the next slice of each list, starting at the stored pointer, and advances the pointer (scripts/rotation.py).
  Connector queries are cheap and run every time; web queries rotate. Connector searches always filter to roles posted in
  the last 7 days (3 on Mondays).
dream_employers:
- name: Vanguard
  method: page
  url: "https://www.vanguardjobs.com"
  fallback: "search: site:vanguardjobs.com 2027 OR \"entry level\" OR \"leadership program\""
  notes: Technology Leadership Program (Malvern PA, Charlotte NC). Daniel already applied to Entry Level Application Engineer
    (Charlotte + PA).
  search: "site:vanguardjobs.com 2027 OR \"entry level\" OR \"leadership program\" technology"
- name: Capital One
  method: search
  url: "https://www.capitalonecareers.com"
  fallback: "search: Capital One Technology Development Program 2027 OR \"Associate Software Engineer\" OR \"Data Analyst\"\
    \ site:capitalonecareers.com"
  notes: TDP (Aug 2027) closed as of 2026-10-22; watched row in tracker. McLean VA / Richmond VA / Philadelphia DE / NYC offices.
  search: "site:capitalonecareers.com 2027 \"Technology Development Program\" OR \"Associate\" data OR software"
- name: Google
  method: page
  url: "https://www.google.com/about/careers/applications/jobs/results?target_level=EARLY&location=United%20States"
  fallback: "search: Google early career 2027 data OR analyst OR engineer site:google.com/about/careers"
  notes: Exclude any role on YouTube teams. Gen-AI rule does not apply (dream override).
  search: "site:google.com/about/careers \"early career\" OR \"new grad\" 2027 data OR analyst OR engineer -youtube"
- name: Cisco
  method: page
  url: "https://careers.cisco.com/global/en/c/university-jobs"
  fallback: "search: Cisco university OR \"new grad\" 2027 site:careers.cisco.com"
  notes: Skip defense/government-security programs.
  search: "site:careers.cisco.com \"university\" OR \"new grad\" OR \"early career\" 2027"
- name: Intel
  method: search
  url: "https://jobs.intel.com"
  fallback: "search: Intel \"college graduate\" OR \"new grad\" 2027 data OR software site:jobs.intel.com"
  notes: Skip roles tied to defense programs or requiring clearance.
  search: "site:jobs.intel.com \"college graduate\" OR \"new grad\" data OR software"
- name: Edmunds
  method: page
  url: "https://www.builtinla.com/company/edmunds/jobs"
  fallback: "search: Edmunds.com jobs associate OR analyst OR engineer"
  notes: Edmunds.com (car shopping), Santa Monica CA; remote-friendly. Not Edmund Optics.
  search: Edmunds.com careers associate OR analyst OR engineer remote
- name: Affirm
  method: greenhouse_api
  url: "https://boards-api.greenhouse.io/v1/boards/affirm/jobs"
  fallback: "page: https://www.affirm.com/careers"
  notes: Many roles remote US.
  search: "site:job-boards.greenhouse.io/affirm \"early career\" OR \"Analyst I\" OR \"new grad\""
- name: ABN AMRO
  method: search
  url: "https://www.abnamro.com/en/careers"
  fallback: "search: ABN AMRO Clearing USA jobs Chicago OR New York associate OR analyst"
  notes: "US presence mainly ABN AMRO Clearing (Chicago). Chicago not on Daniel's relocation list; show only if remote or NYC."
  search: "ABN AMRO Clearing USA jobs associate OR analyst Chicago OR \"New York\""
- name: Toast
  method: greenhouse_api
  url: "https://boards-api.greenhouse.io/v1/boards/toast/jobs"
  fallback: "page: https://careers.toasttab.com"
  notes: Boston HQ; many remote US roles.
  search: "site:job-boards.greenhouse.io/toast OR site:careers.toasttab.com associate OR \"I\" OR early career"
- name: HubSpot
  method: page
  url: "https://www.hubspot.com/careers/jobs?hubs_signup-url=www.hubspot.com%2Fcareers&page=1"
  fallback: "page: https://www.hubspot.com/careers/emerging-talent"
  notes: Emerging Talent program; Cambridge MA, remote US.
  search: "site:hubspot.com/careers \"emerging talent\" OR \"new grad\" OR associate"
- name: monday.com
  method: page
  url: "https://builtin.com/company/mondaycom/jobs"
  fallback: "page: https://monday.com/careers"
  notes: NYC office.
  search: "monday.com careers New York associate OR junior OR \"new grad\""
- name: Datadog
  method: greenhouse_api
  url: "https://boards-api.greenhouse.io/v1/boards/datadog/jobs"
  fallback: "page: https://careers.datadoghq.com"
  notes: "NYC HQ (hybrid). Large board: API output is truncated, so filter by keywords in the fetch prompt."
  search: "site:careers.datadoghq.com \"new grad\" OR associate OR \"early career\" New York"
dream_note: "Checked fully on every run. Dream employers override excluded_categories in criteria.json but never the 'never'\
  \ list. FETCH RULE: WebFetch only opens URLs that came from a WebSearch result in the same session; typed or config URLs\
  \ are refused ('not on the allowlist'). So every employer is reached by running its `search` query first and fetching result\
  \ links. `url` is reference only."
dream_fetch_prompt: "List every job on this board located in the United States (or remote US) whose title or text suggests\
  \ entry level, new grad, early career, associate, analyst, 2027 start, rotational/development program, intern (short-term\
  \ only if paid and remote), or 0-2 years. For each: title, location, URL, posting date if shown. Ignore senior/staff/principal/manager/director\
  \ roles. Output JSON lines only."
email_alerts:
  _about: "Inbox helper: job-alert senders whose emails are read as leads (not application updates)"
  alert_senders:
  - indeed.com
  - linkedin.com
  - glassdoor.com
  - jobright.ai
  - joinhandshake.com
  - ziprecruiter.com
  ignore_subjects:
  - Job digest
