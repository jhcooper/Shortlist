  list_sources:
  - name: zapplyjobs New-Grad Data Science/Analyst 2027
    url: "https://github.com/zapplyjobs/New-Grad-Data-Science-Jobs-2027"
    fetch_prompt: "From the Data Scientist and Data Analyst tables, list every US posting with Posted age of 3 days or less\
      \ (e.g. '16h', '1d', '2d', '3d') whose role is entry level, new grad, early career, associate, analyst I/1, or a 2027\
      \ program. Skip manager, lead, senior, principal, director, team lead, SME, co-op/intern (unless paid, remote and part-time).\
      \ Output JSON lines: {company, title, location, posted_age, url}."
    search: zapplyjobs New-Grad-Data-Science-Jobs-2027 github
search_note: Each run takes the next slice of each list, starting at the stored pointer, and advances the pointer (scripts/rotation.py).
  Connector queries are cheap and run every time; web queries rotate. Connector searches always filter to roles posted in
  the last 7 days (3 on Mondays).
dream_employers:
- name: Comcast
  method: search
  url: "https://jobs.comcast.com"
  fallback: "search: Comcast early career OR \"new grad\" data analyst Philadelphia site:jobs.comcast.com"
  notes: Philadelphia HQ; early-career analytics and engineering programs.
  search: "site:jobs.comcast.com \"early career\" OR \"new grad\" OR associate data OR analyst Philadelphia"
- name: Children's Hospital of Philadelphia
  method: search
  url: "https://careers.chop.edu"
  fallback: "search: CHOP research data analyst OR analytics entry level site:careers.chop.edu"
  notes: Large research and analytics groups; many entry-level analyst roles.
  search: "site:careers.chop.edu data analyst OR analytics OR biostatistics"
- name: Toast
  method: greenhouse_api
  url: "https://boards-api.greenhouse.io/v1/boards/toast/jobs"
  fallback: "page: https://careers.toasttab.com"
  notes: Many remote US roles.
  search: "site:job-boards.greenhouse.io/toast associate OR \"I\" OR early career"
dream_note: "Checked fully on every run. Dream employers override excluded_categories in criteria.json but never the 'never'\
  \ list. FETCH RULE: WebFetch only opens URLs that came from a WebSearch result in the same session; typed or config URLs\
  \ are refused ('not on the allowlist'). So every employer is reached by running its `search` query first and fetching result\
  \ links. `url` is reference only."
dream_fetch_prompt: "List every job on this board located in the United States (or remote US) whose title or text suggests\
  \ entry level, new grad, early career, associate, analyst, 2027 start, rotational/development program, intern (short-term\
  \ only if paid and remote), or 0-2 years. For each: title, location, URL, posting date if shown. Ignore senior/staff/principal/manager/director\
  \ roles. Output JSON lines only."
email_alerts:
